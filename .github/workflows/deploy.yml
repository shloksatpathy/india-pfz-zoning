name: Deploy site

# Publishes the committed docs/site whenever a push changes it, independent of
# the data pipeline (PFEG ERDDAP sometimes refuses GitHub runners). The weekly
# job deploys its own commits, since pushes made by Actions do not trigger this.
on:
  push:
    branches: [main]
    paths: ["docs/site/**"]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deploy
        uses: actions/deploy-pages@v4
